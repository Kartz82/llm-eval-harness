name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check evalkit tests
      - name: Unit tests
        run: pytest
      - name: Eval release gate (offline mock)
        run: python -m evalkit.run --dataset datasets/support_agent.yaml --target mock --report out/report.md
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: out/report.md
